[package]
name = "dropbridge_ui"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "DropBridgeUI"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.15"

[profile.release]
opt-level = 3
lto = true
strip = true
